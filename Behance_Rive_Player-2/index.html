<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hokie Registration — Interactive Spread</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}canvas{display:block;width:100%;height:100%;touch-action:pan-y}#error{display:none;position:fixed;inset:0;padding:24px;background:#fff;color:#333;font:16px system-ui}</style></head>
<body><canvas id="artwork" aria-label="Interactive Hokie registration redesign spread"></canvas><div id="error" role="alert"></div>
<script src="vendor/rive.js"></script>
<script>
const canvas=document.getElementById('artwork');
function fail(message){const box=document.getElementById('error');box.textContent=message;box.style.display='block';}
if(!window.rive){fail('The animation player could not load. Please reload.');}else{
rive.RuntimeLoader.setWasmUrl('vendor/rive.wasm');
const player=new rive.Rive({src:'animation.riv',canvas,artboard:'Artboard 1',stateMachines:'State Machine 1',autoplay:true,autoBind:true,
layout:new rive.Layout({fit:rive.Fit.Contain,alignment:rive.Alignment.Center}),
onLoad:()=>player.resizeDrawingSurfaceToCanvas(Math.min(window.devicePixelRatio||1,2)),
onLoadError:()=>fail('The animation could not load. Please reload or check that all ZIP files were uploaded.')});
new ResizeObserver(()=>player.resizeDrawingSurfaceToCanvas(Math.min(window.devicePixelRatio||1,2))).observe(canvas);
window.addEventListener('pagehide',()=>player.cleanup(),{once:true});
}
</script></body></html>
